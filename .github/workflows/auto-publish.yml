name: Auto Publish Blog

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  auto-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger keyword collection & auto-publish
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://jobs-platform-gold.vercel.app/api/admin/keywords/collect")
          echo "$RESPONSE"
          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)
          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "Request failed with HTTP $HTTP_CODE"
            exit 1
          fi
